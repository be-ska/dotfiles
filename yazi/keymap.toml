# smart enter
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the directory, or open the file"

# reveal in Finder
[[mgr.prepend_keymap]]
on   = "o"
run  = 'shell -- open -R "$0"'
desc = "Reveal in Finder"

# copy file(s) to system clipboard
[[mgr.prepend_keymap]]
on   = ["c", "C"]
run  = '''shell -- osascript -l JavaScript -e 'ObjC.import("AppKit"); function run(a) { const u = $.NSMutableArray.array; a.forEach(p => u.addObject($.NSURL.fileURLWithPath(p))); const pb = $.NSPasteboard.generalPasteboard; pb.clearContents; pb.writeObjects(u) }' "$@"'''
desc = "Copy file(s) to system clipboard"

# keymap for bookmarks
[[mgr.prepend_keymap]]
on = ["g", "H"]
run = "cd ~/gdrive/Hardware"
desc = "Go to Hardware"
[[mgr.prepend_keymap]]
on = ["g", "I"]
run = "cd ~/icloud"
desc = "Go to iCloud"
[[mgr.prepend_keymap]]
on = ["g", "A"]
run = "cd ~/Library/CloudStorage/Dropbox"
desc = "Go to Aelettronica Dropbox"
[[mgr.prepend_keymap]]
on = ["g", "G"]
run = "cd ~/gdrive"
desc = "Go to Align Google Drive"
